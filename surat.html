        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">WEB RPL</div>
        <ul class="nav-links">
            <li><a href="index.html">Halaman Utama</a></li>

        </ul>

        <div class="main-container">
        <div class="form-container">
            <h1>Formulir Pengajuan Surat Izin</h1>
                  
                <form action="proses_surat.php" method="post" target="_blank" onsubmit="return validasiForm()">
                <div class="form-group">
                    <label for="Nama">Nama Lengkap:</label>
                    <input type="text" name="nama" id="nama" required placeholder="Contoh: Budiman">
                </div>

                <div class="form-group">
                    <label for="NIS">NIS:</label>
                    <input type="number" name="nis" id="nis" required placeholder="Contoh: 2570">
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas:</label>
                    <input type="text" name="kelas" id="kelas" required placeholder="Contoh: XI RPL 1">
                </div>

                <div class="form-group">
                    <label for="alasan">Alasan Izin:</label>
                    <select name="alasan" id="alasan" required>
                        <option value="">--Pilih Alasan--</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Acara Keluarga">Acara Keluarga</option>
                        <option value="Keperluan Magang">Keperluan Magang</option>
                        <option value="Izin Terlambat">Izin Terlambat</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                    <label for="Tanggal Mulai">Tanggal Mulai:</label>
                    <input type="date" name="tgl_mulai" id="tgl_mulai" required>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                    <label for="Tanggal Selesai">Tanggal Selesai:</label>
                    <input type="date" name="tgl_selesai" id="tgl_elesai" required>
                </div>

                <div class="form-group">
                    <label for="Keterangan">Keterangan:</label>
                    <textarea name="keterangan" rows="3" id="keterangan" placeholder="Masukkan detail alasan..."></textarea>
                </div><br>
         </form>
        </div>
        <button type="submit">Buat Surat</button>
</body>
</html>
